openapi: 3.1.0
info:
  title: Sowa Kouji API
  version: v1
  description: memory / PostgreSQL providerで共通利用するAPI契約。正式認証とprivate object storage写真共有の境界を含む。
servers:
  - url: https://api.example.invalid/api/v1
security:
  - bearerAuth: []
  - mockUser: []
paths:
  /health:
    get:
      security: []
      summary: 稼働状態
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /auth/config:
    get:
      security: []
      summary: Firebase Web SDK初期化に必要な公開設定だけを返す
      responses:
        '200':
          description: 公開client設定
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuthClientConfig' }
  /auth/login:
    post:
      security: []
      summary: loginIdまたはemailとpasswordを検証しIdentity Providerのcustom tokenを返す
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      summary: Bearer ID tokenに対応する有効user
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      summary: ログアウトをauditへ記録する。Frontendは成否にかかわらずIdentity sessionを破棄する。
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/password:
    post:
      summary: 自分のpassword変更
      requestBody: { $ref: '#/components/requestBodies/JsonBody' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users:
    get:
      summary: 認証user一覧（adminのみ）
      responses:
        '200': { $ref: '#/components/responses/List' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: 認証user追加（adminのみ、password必須）
      requestBody: { $ref: '#/components/requestBodies/JsonBody' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Validation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      summary: 認証user詳細（adminのみ）
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: 認証user更新・active切替（adminのみ、version必須）
      requestBody: { $ref: '#/components/requestBodies/VersionedJsonBody' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{id}/password-reset:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      summary: password reset（adminのみ、versionとnewPassword必須）
      requestBody: { $ref: '#/components/requestBodies/VersionedJsonBody' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Validation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /cases:
    get:
      summary: 案件一覧。workerは担当案件だけ。入居者名・電話番号は認証済みの許可案件だけに含む。
      responses:
        '200': { $ref: '#/components/responses/List' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: 案件登録（admin / office）
      requestBody: { $ref: '#/components/requestBodies/JsonBody' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Validation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /cases/{caseId}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      summary: 案件詳細。入居者名・電話番号は認証済みの許可案件だけに含む。
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: 案件更新。version必須。
      requestBody: { $ref: '#/components/requestBodies/VersionedJsonBody' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Validation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /cases/{caseId}/workflow-history:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      summary: 工程履歴
      responses:
        '200': { $ref: '#/components/responses/List' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /cases/{caseId}/schedule-history:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      summary: 予定変更履歴
      responses:
        '200': { $ref: '#/components/responses/List' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /cases/{caseId}/photos:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      summary: 写真一覧。権限確認後、保存写真だけ短時間のread URLをsourceへ設定する。
      responses:
        '200': { $ref: '#/components/responses/List' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: 圧縮済みJPEG写真登録。写真POSTだけ専用body上限を利用する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [group, source, mimeType]
              properties:
                group: { type: string, enum: [survey, before, during, after] }
                source: { type: string, description: JPEG Data URL。DBには保存しない。 }
                mimeType: { type: string, const: image/jpeg }
                name: { type: string, maxLength: 255 }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Validation' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /cases/{caseId}/photos/{photoId}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - name: photoId
        in: path
        required: true
        schema: { type: string }
    delete:
      summary: 写真metadataとprivate objectを再試行可能な二段階処理で削除
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /properties:
    get:
      summary: 物件一覧（admin / office）
      responses:
        '200': { $ref: '#/components/responses/List' }
    post:
      summary: 物件登録（admin）
      requestBody: { $ref: '#/components/requestBodies/JsonBody' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /properties/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      summary: 物件詳細
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: 物件更新・active切替（admin、version必須）
      requestBody: { $ref: '#/components/requestBodies/VersionedJsonBody' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /rooms:
    get:
      summary: 部屋一覧（admin / office）
      responses:
        '200': { $ref: '#/components/responses/List' }
    post:
      summary: 部屋登録（admin）
      requestBody: { $ref: '#/components/requestBodies/JsonBody' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /rooms/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      summary: 部屋詳細
      responses:
        '200': { $ref: '#/components/responses/Success' }
    patch:
      summary: 部屋更新・active切替（admin、version必須）
      requestBody: { $ref: '#/components/requestBodies/VersionedJsonBody' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
  /staff:
    get:
      summary: 担当者一覧（admin / office）
      responses:
        '200': { $ref: '#/components/responses/List' }
    post:
      summary: 担当者登録（admin）
      requestBody: { $ref: '#/components/requestBodies/JsonBody' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /staff/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      summary: 担当者詳細
      responses:
        '200': { $ref: '#/components/responses/Success' }
    patch:
      summary: 担当者更新・active切替（admin、version必須）
      requestBody: { $ref: '#/components/requestBodies/VersionedJsonBody' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
  /responses:
    get:
      summary: 入居者回答一覧（admin / office）
      responses:
        '200': { $ref: '#/components/responses/List' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /responses/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      summary: 入居者回答詳細（admin / office）
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
  /audit:
    get:
      summary: 操作履歴一覧。任意作成POSTは提供しない。
      responses:
        '200': { $ref: '#/components/responses/List' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /public/resident/{token}:
    parameters:
      - $ref: '#/components/parameters/ResidentToken'
    get:
      security: []
      summary: 入居者回答画面に必要な最小情報
      responses:
        '200':
          description: 公開情報
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [propertyName, roomName, accepting, closed]
                    properties:
                      propertyName: { type: string }
                      roomName: { type: string }
                      accepting: { type: boolean }
                      closed: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }
  /public/resident/{token}/responses:
    parameters:
      - $ref: '#/components/parameters/ResidentToken'
    post:
      security: []
      summary: 入居者希望日時を送信
      requestBody: { $ref: '#/components/requestBodies/JsonBody' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Validation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OIDC
      description: Identity Providerが発行したID token。BackendはuidからDB userを再取得しrole/staffIdを判定する。
    mockUser:
      type: apiKey
      in: header
      name: x-mock-user-id
      description: development環境だけで利用する契約確認用ユーザー。productionでは無効。
  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      schema: { type: string }
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ResidentToken:
      name: token
      in: path
      required: true
      schema: { type: string, minLength: 16 }
  requestBodies:
    JsonBody:
      required: true
      content:
        application/json:
          schema: { type: object }
    VersionedJsonBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [version]
            properties:
              version: { type: integer, minimum: 1 }
            additionalProperties: true
  schemas:
    AuthClientConfig:
      type: object
      additionalProperties: false
      required: [configured, provider]
      properties:
        configured: { type: boolean }
        provider: { type: string, enum: [firebase, fake, unconfigured] }
        apiKey: { type: string, description: Firebase Authentication Web SDK用の公開API key }
        authDomain: { type: string }
        projectId: { type: string }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier: { type: string, minLength: 1, description: loginIdまたはemail }
        password: { type: string, minLength: 1, writeOnly: true }
    AuthUser:
      type: object
      additionalProperties: false
      required: [id, userId, loginId, displayName, role, active, version]
      properties:
        id: { type: string }
        userId: { type: string }
        loginId: { type: string }
        email: { type: [string, 'null'], format: email }
        displayName: { type: string }
        role: { type: string, enum: [admin, office, worker] }
        staffId: { type: [string, 'null'] }
        active: { type: boolean }
        passwordChangedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, INTERNAL_ERROR]
            message: { type: string }
            details: { type: object }
  responses:
    Success:
      description: 成功
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties: { data: {} }
    List:
      description: 一覧
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: { type: array, items: {} }
              meta:
                type: object
                required: [count]
                properties: { count: { type: integer, minimum: 0 } }
    Validation:
      description: 入力不正
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: 未認証
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: 権限なし
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: 見つからない
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: 更新競合・業務競合
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
