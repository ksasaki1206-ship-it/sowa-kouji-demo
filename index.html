<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>総和 工事進捗管理</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;background:#f6f8fb;color:#172033}.app{max-width:900px;margin:auto;padding:14px 12px 70px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-weight:800}.sub{font-size:12px;color:#667085}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tab,.btn{min-height:44px;border:1px solid #e5e7eb;background:#fff;border-radius:10px;padding:0 13px;font-weight:700}.tab.active,.btn.primary{background:#0f766e;color:#fff;border-color:#0f766e}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;margin-top:12px;overflow:hidden}.stat{padding:12px}.k{font-size:11px;color:#667085}.v{font-size:25px;font-weight:800}.title{padding:12px 14px;font-weight:800;border-bottom:1px solid #e5e7eb}.row{width:100%;padding:13px 14px;border:0;border-bottom:1px solid #e5e7eb;background:#fff;text-align:left;display:flex;justify-content:space-between;gap:8px;min-height:60px}.row:last-child{border-bottom:0}.main{font-weight:700}.muted{font-size:12px;color:#667085;margin-top:3px}.search{display:grid;grid-template-columns:1fr 150px;gap:8px;margin-top:12px}.input,.select,.textarea{width:100%;box-sizing:border-box;min-height:44px;border:1px solid #e5e7eb;border-radius:10px;padding:9px 11px;background:#fff;font-size:16px}.case{width:100%;margin-top:8px;padding:12px;border:1px solid #e5e7eb;border-radius:12px;background:#fff;text-align:left}.badge{font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px;background:#eef2f6}.caseHead{display:flex;justify-content:space-between;gap:8px}.detail{padding:14px}.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kv>div{padding:10px;background:#fafafa;border-radius:10px}.lab{font-size:11px;color:#667085}.val{font-weight:700;margin-top:3px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.form{padding:14px}.form label{display:block;font-size:13px;font-weight:700;margin-top:10px}.form label span{display:block;margin-bottom:5px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.notice{display:none;margin-top:12px;padding:10px 12px;border:1px solid #d1d5db;border-left:4px solid #0f766e;border-radius:10px;background:#fff}.foot{text-align:center;color:#667085;font-size:12px;margin-top:18px}@media(max-width:640px){.top{display:block}.tabs{margin-top:10px}.search,.kv,.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <div><div class="brand">総和 工事進捗管理</div><div class="sub">お客様操作用・簡易デモ</div></div>
    <div class="tabs">
      <button type="button" class="tab active" data-view="home">今日の予定</button>
      <button type="button" class="tab" data-view="cases">案件一覧</button>
      <button type="button" class="tab" data-view="resident">入居者入力</button>
    </div>
  </div>
  <div id="notice" class="notice"></div>

  <section id="view-home">
    <div class="stats">
      <div class="card stat"><div class="k">進行中案件</div><div class="v">6</div></div>
      <div class="card stat"><div class="k">本日現調</div><div class="v">2</div></div>
      <div class="card stat"><div class="k">本日工事</div><div class="v">1</div></div>
    </div>
    <div class="card"><div class="title">本日の現調</div>
      <button type="button" class="row jump" data-id="c1"><span><span class="main">9:00　○○マンション 101号室</span><span class="muted">担当：佐藤</span></span><b>›</b></button>
      <button type="button" class="row jump" data-id="c2"><span><span class="main">13:00　△△ハイツ 202号室</span><span class="muted">担当：鈴木</span></span><b>›</b></button>
    </div>
    <div class="card"><div class="title">本日の工事</div>
      <button type="button" class="row jump" data-id="c3"><span><span class="main">9:00　□□コーポ 301号室</span><span class="muted">担当：山田班</span></span><b>›</b></button>
    </div>
    <div class="card"><div class="title">日程未確定</div>
      <button type="button" class="row jump" data-id="c4"><span><span class="main">○○マンション 102号室</span><span class="muted">入居者回答待ち</span></span><b>›</b></button>
      <button type="button" class="row jump" data-id="c5"><span><span class="main">◇◇ハイツ 105号室</span><span class="muted">施工担当未定</span></span><b>›</b></button>
    </div>
  </section>

  <section id="view-cases" class="hidden">
    <div class="search">
      <input id="search" class="input" type="search" placeholder="物件名・部屋・担当者で検索">
      <select id="filter" class="select"><option value="all">すべて</option><option>現調調整中</option><option>材料手配中</option><option>施工予定</option><option>見積中</option><option>完了</option></select>
    </div>
    <div id="caseList"></div>
  </section>

  <section id="view-detail" class="hidden">
    <button type="button" id="back" class="btn" style="margin-top:12px">← 案件一覧へ</button>
    <div id="detailCard" class="card detail"></div>
  </section>

  <section id="view-resident" class="hidden">
    <form id="residentForm" class="card form">
      <div style="font-size:18px;font-weight:800">現地調査 希望日時のご入力</div>
      <div class="muted">QRコードから開く入居者向け画面のイメージです。</div>
      <label><span>物件名</span><input class="input" name="property" value="○○マンション" required></label>
      <div class="two">
        <label><span>部屋番号</span><input class="input" name="room" placeholder="101号室" required></label>
        <label><span>お名前</span><input class="input" name="name" placeholder="山田 太郎" required></label>
      </div>
      <label><span>電話番号</span><input class="input" name="phone" placeholder="090-1234-5678" required></label>
      <div class="two">
        <label><span>第1希望</span><input class="input" name="date1" type="date" value="2026-09-03" required></label>
        <label><span>時間帯</span><select class="select" name="time1"><option>9:00〜12:00</option><option>13:00〜15:00</option><option>15:00〜17:00</option></select></label>
      </div>
      <label><span>その他連絡事項</span><textarea class="textarea" rows="3" name="note"></textarea></label>
      <button type="submit" class="btn primary" style="width:100%;margin-top:14px">希望日時を送信する</button>
    </form>
  </section>
  <div class="foot">※このデモは説明用です。入力内容は再読み込みで初期状態に戻ります。</div>
</main>
<script>
(function(){
  'use strict';
  var cases=[
    {id:'c1',p:'○○マンション',r:'101号室',s:'現調調整中',next:'現調実施',staff:'佐藤',work:'未定',address:'東京都○○区○○町1-2-3',owner:'○○管理株式会社'},
    {id:'c2',p:'△△ハイツ',r:'202号室',s:'現調調整中',next:'現調実施',staff:'鈴木',work:'未定',address:'東京都△△区△△町3-4-5',owner:'△△不動産'},
    {id:'c3',p:'□□コーポ',r:'301号室',s:'施工予定',next:'施工実施',staff:'佐藤',work:'山田班',address:'埼玉県□□市□□1-1-1',owner:'□□管理'},
    {id:'c4',p:'○○マンション',r:'102号室',s:'現調調整中',next:'入居者回答待ち',staff:'佐藤',work:'未定',address:'東京都○○区○○町1-2-3',owner:'○○管理株式会社'},
    {id:'c5',p:'◇◇ハイツ',r:'105号室',s:'材料手配中',next:'施工担当設定',staff:'鈴木',work:'未定',address:'千葉県◇◇市◇◇2-2-2',owner:'◇◇プロパティ'},
    {id:'c6',p:'△○マンション',r:'203号室',s:'見積中',next:'見積提出',staff:'佐藤',work:'未定',address:'東京都△○区1-5-2',owner:'△○管理'}
  ];
  function $(id){return document.getElementById(id)}
  function show(view){
    ['home','cases','detail','resident'].forEach(function(v){$('view-'+v).classList.toggle('hidden',v!==view)});
    document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-view')===view || (view==='detail' && b.getAttribute('data-view')==='cases'))});
  }
  function message(text){var n=$('notice');n.textContent=text;n.style.display='block';window.setTimeout(function(){n.style.display='none'},2500)}
  function renderList(){
    var q=$('search').value.toLowerCase(); var f=$('filter').value;
    var filtered=cases.filter(function(c){return (f==='all'||c.s===f) && (c.p+' '+c.r+' '+c.staff+' '+c.work).toLowerCase().indexOf(q)>-1});
    $('caseList').innerHTML='';
    filtered.forEach(function(c){
      var b=document.createElement('button'); b.type='button'; b.className='case'; b.setAttribute('data-id',c.id);
      b.innerHTML='<div class="caseHead"><div><b>'+c.p+' '+c.r+'</b><div class="muted">次：'+c.next+' ／ 現調：'+c.staff+' ／ 工事：'+c.work+'</div></div><span class="badge">'+c.s+'</span></div>';
      b.addEventListener('click',function(){openDetail(c.id)}); $('caseList').appendChild(b);
    });
  }
  function openDetail(id){
    var c=cases.find(function(x){return x.id===id}); if(!c)return;
    $('detailCard').innerHTML='<div class="caseHead"><div><div style="font-size:20px;font-weight:800">'+c.p+' '+c.r+'</div><div class="muted">'+c.address+'</div></div><span class="badge">'+c.s+'</span></div><div class="kv" style="margin-top:14px"><div><div class="lab">管理会社</div><div class="val">'+c.owner+'</div></div><div><div class="lab">次のアクション</div><div class="val">'+c.next+'</div></div><div><div class="lab">現調担当</div><div class="val">'+c.staff+'</div></div><div><div class="lab">工事担当</div><div class="val">'+c.work+'</div></div></div><div class="actions"><button type="button" id="advance" class="btn primary">次の工程へ進める</button><button type="button" id="assign" class="btn">工事担当を山田班に設定</button></div>';
    $('advance').addEventListener('click',function(){
      var order=['現調調整中','見積中','材料手配中','施工予定','完了']; var i=order.indexOf(c.s);
      if(i<order.length-1){c.s=order[i+1];c.next=c.s==='見積中'?'見積提出':c.s==='材料手配中'?'材料発注':c.s==='施工予定'?'施工実施':'完了報告';message('ステータスを「'+c.s+'」に更新しました');renderList();openDetail(c.id)}else{message('この案件は完了しています')}
    });
    $('assign').addEventListener('click',function(){c.work='山田班';if(c.next==='施工担当設定')c.next='施工日確認';message('工事担当を山田班に設定しました');renderList();openDetail(c.id)});
    show('detail');
  }
  document.querySelectorAll('.tab').forEach(function(b){b.addEventListener('click',function(){var v=b.getAttribute('data-view');show(v);if(v==='cases')renderList()})});
  document.querySelectorAll('.jump').forEach(function(b){b.addEventListener('click',function(){openDetail(b.getAttribute('data-id'))})});
  $('back').addEventListener('click',function(){renderList();show('cases')});
  $('search').addEventListener('input',renderList); $('filter').addEventListener('change',renderList);
  $('residentForm').addEventListener('submit',function(e){e.preventDefault();var fd=new FormData(e.target);var room=String(fd.get('room')||'');var name=String(fd.get('name')||'');message('希望日時を受け付けました：'+room+' '+name+'様');});
  renderList(); show('home');
})();
</script>
</body>
</html>
