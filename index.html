<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><title>総和 工事進捗管理</title><style>:root{--bg:#f6f8fb;--card:#fff;--line:#e5e7eb;--text:#172033;--muted:#667085;--accent:#0f766e;--soft:#e9f5f2;--red:#b42318}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{max-width:980px;margin:auto;padding:14px 12px 80px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.brand{font-size:19px;font-weight:800}.muted{font-size:12px;color:var(--muted)}.tabs,.actions{display:flex;gap:7px;flex-wrap:wrap}.tab,.btn{min-height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 13px;font-weight:700}.tab.active,.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.danger{color:var(--red)}.hidden{display:none!important}.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.stat{padding:12px}.k{font-size:11px;color:var(--muted)}.v{font-size:25px;font-weight:800}.title{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:800}.row{width:100%;min-height:60px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left;display:flex;justify-content:space-between;gap:8px;align-items:center}.row:last-child{border-bottom:0}.rowMain{font-weight:700}.search{display:grid;grid-template-columns:1fr 160px auto;gap:8px;margin-top:12px}.input,.select,.textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 11px;font-size:16px}.textarea{min-height:88px}.case{width:100%;margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left}.caseHead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.badge{font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px;background:#eef2f6;white-space:nowrap}.detail{padding:14px}.big{font-size:20px;font-weight:800}.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.kv>div{background:#fafafa;border-radius:10px;padding:10px}.lab{font-size:11px;color:var(--muted)}.val{font-weight:700;margin-top:3px}.form{padding:14px}.form label{display:block;font-size:13px;font-weight:700;margin-top:10px}.form label span{display:block;margin-bottom:5px}.two{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.notice{display:none;margin-top:10px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.photoGroup{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fafafa}.photoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.thumb{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:#eef2f6}.thumb img{width:100%;height:100%;object-fit:cover}.del{position:absolute;top:5px;right:5px;width:30px;height:30px;border:0;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-weight:800}.uploadLabel{display:flex;align-items:center;justify-content:center;min-height:46px;border:1px dashed #94a3b8;border-radius:10px;background:#fff;font-weight:700;cursor:pointer}.uploadLabel input{display:none}.hint{font-size:11px;color:var(--muted);margin-top:6px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;padding:14px;z-index:20}.modalbox{width:min(700px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:14px;padding:14px}.modalhead{display:flex;justify-content:space-between;gap:8px;align-items:center}.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}@media(max-width:700px){.top{display:block}.tabs{margin-top:10px}.stats{grid-template-columns:repeat(2,1fr)}.search,.kv,.two,.gallery{grid-template-columns:1fr}.photoGrid{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="app"><div class="top"><div><div class="brand">総和 工事進捗管理</div><div class="muted">お客様操作用デモ</div></div><div class="tabs"><button class="tab active" data-view="home">今日</button><button class="tab" data-view="cases">案件</button><button class="tab" data-view="resident">入居者</button><button class="tab" data-view="responses">回答一覧</button></div></div><div id="notice" class="notice"></div><section id="view-home"><div class="stats"><div class="card stat"><div class="k">進行中</div><div id="stOpen" class="v">0</div></div><div class="card stat"><div class="k">本日現調</div><div id="stSurvey" class="v">0</div></div><div class="card stat"><div class="k">本日工事</div><div id="stWork" class="v">0</div></div><div class="card stat"><div class="k">回答待ち</div><div id="stWait" class="v">0</div></div></div><div id="todayBlocks"></div></section><section id="view-cases" class="hidden"><div class="search"><input id="search" class="input" placeholder="物件・部屋・担当で検索"><select id="filter" class="select"></select><button id="newCase" class="btn primary" type="button">＋案件登録</button></div><div class="actions" style="margin-top:8px"><button id="resetDemo" class="btn danger" type="button">デモ初期化</button></div><div id="caseList"></div></section><section id="view-detail" class="hidden"><button id="back" class="btn" type="button" style="margin-top:12px">← 案件一覧</button><div id="detailCard" class="card detail"></div></section><section id="view-resident" class="hidden"><form id="residentForm" class="card form"><div class="big">現地調査 希望日時のご入力</div><div class="muted">案内文のQRコードから回答する想定です。</div><label><span>物件名</span><input class="input" name="property" value="○○マンション" required></label><div class="two"><label><span>部屋番号</span><input class="input" name="room" value="102号室" required></label><label><span>お名前</span><input class="input" name="name" placeholder="山田 太郎" required></label></div><label><span>電話番号</span><input class="input" name="phone" placeholder="090-1234-5678" required></label><div class="two"><label><span>第1希望</span><input class="input" name="d1" type="date" value="2026-09-03" required></label><label><span>時間帯</span><select class="select" name="t1"><option>9:00〜12:00</option><option>13:00〜15:00</option><option>15:00〜17:00</option></select></label></div><label><span>その他連絡事項</span><textarea class="textarea" name="note"></textarea></label><button class="btn primary" style="width:100%;margin-top:14px" type="submit">希望日時を送信</button></form></section><section id="view-responses" class="hidden"><div id="responseList"></div></section><div class="foot">※デモ内容と写真はこの端末内に保存されます。写真は縮小保存されます。</div></main><div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><div id="modalTitle" class="big">案件登録</div><button id="closeModal" class="btn" type="button">閉じる</button></div><form id="caseForm" class="form"><input type="hidden" name="id"><div class="two"><label><span>物件名</span><input class="input" name="property" required></label><label><span>部屋番号</span><input class="input" name="room" required></label></div><label><span>住所</span><input class="input" name="address"></label><div class="two"><label><span>管理会社</span><input class="input" name="owner"></label><label><span>ステータス</span><select class="select" name="status" id="statusSelect"></select></label></div><div class="two"><label><span>現調担当</span><select class="select" name="surveyStaff"><option>未定</option><option>佐藤</option><option>鈴木</option><option>田中</option></select></label><label><span>現調日時</span><input class="input" type="datetime-local" name="surveyAt"></label></div><div class="two"><label><span>工事担当</span><select class="select" name="workStaff"><option>未定</option><option>山田班</option><option>高橋班</option><option>佐々木班</option></select></label><label><span>工事日時</span><input class="input" type="datetime-local" name="workAt"></label></div><label><span>備考</span><textarea class="textarea" name="note"></textarea></label><button class="btn primary" style="width:100%;margin-top:12px" type="submit">保存</button></form></div></div><script>(function(){'use strict';var KEY='sowa-demo-photo-v1';var statuses=['問い合わせ','現調調整中','現調済','見積中','見積提出','受注','材料手配中','材料納品済','施工予定','施工済','写真登録','完了'];var initial={cases:[{id:'c1',property:'○○マンション',room:'101号室',address:'東京都○○区○○町1-2-3',owner:'○○管理株式会社',status:'現調調整中',surveyStaff:'佐藤',surveyAt:'2026-08-31T09:00',workStaff:'未定',workAt:'',note:'入居者と時間確認済み',photos:{survey:[],before:[],during:[],after:[]}},{id:'c2',property:'△△ハイツ',room:'202号室',address:'東京都△△区△△町3-4-5',owner:'△△不動産',status:'現調済',surveyStaff:'鈴木',surveyAt:'2026-08-31T13:00',workStaff:'未定',workAt:'',note:'見積作成待ち',photos:{survey:[],before:[],during:[],after:[]}},{id:'c3',property:'□□コーポ',room:'301号室',address:'埼玉県□□市□□1-1-1',owner:'□□管理',status:'施工予定',surveyStaff:'佐藤',surveyAt:'2026-08-26T10:00',workStaff:'山田班',workAt:'2026-08-31T09:00',note:'駐車場1台利用可',photos:{survey:[],before:[],during:[],after:[]}},{id:'c4',property:'○○マンション',room:'102号室',address:'東京都○○区○○町1-2-3',owner:'○○管理株式会社',status:'現調調整中',surveyStaff:'佐藤',surveyAt:'',workStaff:'未定',workAt:'',note:'QR案内配布済／入居者回答待ち',photos:{survey:[],before:[],during:[],after:[]}}],responses:[]};var state=load(),current=null;function $(id){return document.getElementById(id)}function clone(x){return JSON.parse(JSON.stringify(x))}function load(){try{var s=localStorage.getItem(KEY);return s?JSON.parse(s):clone(initial)}catch(e){return clone(initial)}}function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){msg('保存容量を超えました。写真を減らしてください。');return false}}function msg(t){var n=$('notice');n.textContent=t;n.style.display='block';setTimeout(function(){n.style.display='none'},2500)}function fmt(x){return x?x.replace('T',' ').replaceAll('-','/'):'未定'}function nextAction(c){var i=statuses.indexOf(c.status);return i<statuses.length-1?statuses[i+1]:'完了'}function show(v){['home','cases','detail','resident','responses'].forEach(function(x){$('view-'+x).classList.toggle('hidden',x!==v)});document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('active',b.dataset.view===v||(v==='detail'&&b.dataset.view==='cases'))});if(v==='home')renderHome();if(v==='cases')renderCases();if(v==='responses')renderResponses()}function renderHome(){var open=state.cases.filter(function(c){return c.status!=='完了'}).length,survey=state.cases.filter(function(c){return c.surveyAt&&c.surveyAt.slice(0,10)==='2026-08-31'}).length,work=state.cases.filter(function(c){return c.workAt&&c.workAt.slice(0,10)==='2026-08-31'}).length,wait=state.cases.filter(function(c){return c.note.indexOf('回答待ち')>=0}).length;$('stOpen').textContent=open;$('stSurvey').textContent=survey;$('stWork').textContent=work;$('stWait').textContent=wait;var arr=state.cases.slice(0,6);$('todayBlocks').innerHTML='<div class="card"><div class="title">要対応案件</div>'+arr.map(function(c){return'<button class="row open" data-id="'+c.id+'"><span><span class="rowMain">'+c.property+' '+c.room+'</span><span class="muted">'+c.status+' ／ 現調:'+c.surveyStaff+' ／ 工事:'+c.workStaff+'</span></span><b>›</b></button>'}).join('')+'</div>';wireOpen()}function renderCases(){var f=$('filter');if(!f.options.length)f.innerHTML='<option value="all">すべて</option>'+statuses.map(function(s){return'<option>'+s+'</option>'}).join('');var q=$('search').value.toLowerCase(),fv=f.value,arr=state.cases.filter(function(c){return(fv==='all'||c.status===fv)&&(c.property+' '+c.room+' '+c.surveyStaff+' '+c.workStaff).toLowerCase().indexOf(q)>=0});$('caseList').innerHTML=arr.map(function(c){return'<button class="case open" data-id="'+c.id+'"><div class="caseHead"><div><b>'+c.property+' '+c.room+'</b><div class="muted">次：'+nextAction(c)+' ／ 現調：'+c.surveyStaff+' ／ 工事：'+c.workStaff+'</div></div><span class="badge">'+c.status+'</span></div></button>'}).join('')||'<div class="muted" style="padding:18px">該当案件なし</div>';wireOpen()}function wireOpen(){document.querySelectorAll('.open').forEach(function(b){b.onclick=function(){openDetail(b.dataset.id)}})}function galleryHtml(c){return'<div class="gallery">'+photoGroup(c,'survey','現調写真')+photoGroup(c,'before','施工前')+photoGroup(c,'during','施工中')+photoGroup(c,'after','施工後')+'</div>'}function photoGroup(c,key,label){var arr=(c.photos&&c.photos[key])||[];return'<div class="photoGroup"><b>'+label+'</b><label class="uploadLabel">＋ 写真を追加<input class="photoInput" type="file" accept="image/*" capture="environment" multiple data-key="'+key+'"></label><div class="hint">スマホではカメラ撮影または写真選択ができます。</div><div class="photoGrid">'+arr.map(function(src,i){return'<div class="thumb"><img src="'+src+'" alt="'+label+'"><button class="del" type="button" data-key="'+key+'" data-index="'+i+'">×</button></div>'}).join('')+'</div></div>'}function openDetail(id){current=id;var c=state.cases.find(function(x){return x.id===id});if(!c)return;$('detailCard').innerHTML='<div class="caseHead"><div><div class="big">'+c.property+' '+c.room+'</div><div class="muted">'+c.address+'</div></div><span class="badge">'+c.status+'</span></div><div class="kv" style="margin-top:14px"><div><div class="lab">管理会社</div><div class="val">'+(c.owner||'-')+'</div></div><div><div class="lab">次の工程</div><div class="val">'+nextAction(c)+'</div></div><div><div class="lab">現調</div><div class="val">'+fmt(c.surveyAt)+' ／ '+c.surveyStaff+'</div></div><div><div class="lab">施工</div><div class="val">'+fmt(c.workAt)+' ／ '+c.workStaff+'</div></div></div><div class="card"><div class="title">写真管理</div><div class="detail">'+galleryHtml(c)+'</div></div><div class="actions"><button id="advance" class="btn primary">次の工程へ</button><button id="editCase" class="btn">案件編集</button><button id="setSurvey" class="btn">現調日設定</button><button id="setWork" class="btn">施工日設定</button></div><div class="card"><div class="title">備考</div><div style="padding:12px">'+(c.note||'なし')+'</div></div>';document.querySelectorAll('.photoInput').forEach(function(inp){inp.onchange=function(e){handleFiles(c,inp.dataset.key,e.target.files)}});document.querySelectorAll('.del').forEach(function(b){b.onclick=function(){c.photos[b.dataset.key].splice(Number(b.dataset.index),1);save();openDetail(c.id)}});$('advance').onclick=function(){var i=statuses.indexOf(c.status);if(i<statuses.length-1){c.status=statuses[i+1];save();msg('「'+c.status+'」へ進めました');openDetail(c.id)}else msg('完了済みです')};$('editCase').onclick=function(){openCaseModal(c)};$('setSurvey').onclick=function(){c.surveyStaff='佐藤';c.surveyAt='2026-09-03T10:00';if(c.status==='問い合わせ')c.status='現調調整中';save();msg('現調を設定しました');openDetail(c.id)};$('setWork').onclick=function(){c.workStaff='山田班';c.workAt='2026-09-10T09:00';if(statuses.indexOf(c.status)<statuses.indexOf('施工予定'))c.status='施工予定';save();msg('施工日を設定しました');openDetail(c.id)};show('detail')}function handleFiles(c,key,fileList){var files=Array.prototype.slice.call(fileList||[]).slice(0,6);if(!files.length)return;Promise.all(files.map(compressImage)).then(function(imgs){if(!c.photos)c.photos={survey:[],before:[],during:[],after:[]};c.photos[key]=(c.photos[key]||[]).concat(imgs).slice(0,8);if(key==='after'&&c.photos.after.length&&statuses.indexOf(c.status)<statuses.indexOf('写真登録'))c.status='写真登録';save();openDetail(c.id);msg(imgs.length+'枚の写真を追加しました')}).catch(function(){msg('写真の読み込みに失敗しました')})}function compressImage(file){return new Promise(function(resolve,reject){var reader=new FileReader();reader.onerror=reject;reader.onload=function(){var img=new Image();img.onerror=reject;img.onload=function(){var max=900,w=img.width,h=img.height;if(w>h&&w>max){h=Math.round(h*max/w);w=max}else if(h>=w&&h>max){w=Math.round(w*max/h);h=max}var canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;var ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);resolve(canvas.toDataURL('image/jpeg',0.72))};img.src=reader.result};reader.readAsDataURL(file)})}function openCaseModal(c){$('modal').classList.remove('hidden');$('modalTitle').textContent=c?'案件編集':'新規案件登録';var f=$('caseForm');f.reset();f.elements.id.value=c?c.id:'';if(c)Object.keys(c).forEach(function(k){if(f.elements[k]&&typeof c[k]!=='object')f.elements[k].value=c[k]})}function closeModal(){$('modal').classList.add('hidden')}function renderResponses(){$('responseList').innerHTML=state.responses.length?state.responses.slice().reverse().map(function(r){return'<div class="card form"><b>'+r.property+' '+r.room+'</b><div class="muted">'+r.name+'様 ／ '+r.phone+'</div><div style="margin-top:8px">第1希望：'+r.d1+' '+r.t1+'</div></div>'}).join(''):'<div class="card form muted">まだ回答はありません。</div>'}statuses.forEach(function(s){$('statusSelect').insertAdjacentHTML('beforeend','<option>'+s+'</option>')});document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){show(b.dataset.view)}});$('back').onclick=function(){show('cases')};$('search').oninput=renderCases;$('filter').onchange=renderCases;$('newCase').onclick=function(){openCaseModal(null)};$('closeModal').onclick=closeModal;$('caseForm').onsubmit=function(e){e.preventDefault();var fd=new FormData(e.target),id=fd.get('id'),c=id?state.cases.find(function(x){return x.id===id}):{id:'c'+Date.now(),photos:{survey:[],before:[],during:[],after:[]}};['property','room','address','owner','status','surveyStaff','surveyAt','workStaff','workAt','note'].forEach(function(k){c[k]=fd.get(k)||''});if(!id)state.cases.push(c);save();closeModal();renderCases();msg(id?'案件を更新しました':'案件を登録しました')};$('residentForm').onsubmit=function(e){e.preventDefault();var fd=new FormData(e.target),r={property:fd.get('property'),room:fd.get('room'),name:fd.get('name'),phone:fd.get('phone'),d1:fd.get('d1'),t1:fd.get('t1'),note:fd.get('note')};state.responses.push(r);var c=state.cases.find(function(x){return x.property===r.property&&x.room===r.room});if(c){c.note='入居者回答済：'+r.d1+' '+r.t1;c.surveyAt=r.d1+'T10:00'}save();msg('希望日時を受け付けました');show('responses')};$('resetDemo').onclick=function(){if(confirm('デモ内容と写真を初期状態に戻しますか？')){state=clone(initial);save();renderCases();renderHome();msg('初期状態に戻しました')}};renderHome();show('home')})();</script></body></html>
