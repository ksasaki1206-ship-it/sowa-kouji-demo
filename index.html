<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><title>総和 工事進捗管理</title><link rel="stylesheet" href="assets/css/styles.css?v=20260901-7"></head>
<body><main class="app">
<header class="topbar"><div><div class="brand">総和 工事進捗管理</div><div class="muted">お客様操作用デモ</div></div><label class="user-picker"><span>操作ユーザー</span><select id="currentUser" class="select compact"></select></label></header>
<nav class="tabs" aria-label="メインメニュー"><button class="tab active" data-view="home">今日</button><button class="tab" data-view="cases">案件</button><button class="tab" data-view="schedule">スケジュール</button><button class="tab" data-view="responses">回答</button><button class="tab" data-view="history">履歴</button></nav>
<div id="notice" class="notice" role="status" aria-live="polite"></div>
<section id="view-home" class="view"><div class="stats"><div class="card stat"><div class="k">進行中</div><div id="stOpen" class="v">0</div></div><div class="card stat"><div class="k">本日現調</div><div id="stSurvey" class="v">0</div></div><div class="card stat"><div class="k">本日工事</div><div id="stWork" class="v">0</div></div><div class="card stat"><div class="k">回答待ち</div><div id="stWait" class="v">0</div></div></div><div id="todayBlocks"></div></section>
<section id="view-cases" class="view hidden"><div class="search"><input id="search" class="input" placeholder="物件・部屋・担当で検索"><select id="filter" class="select" aria-label="ステータスで絞り込み"></select><button id="newCase" class="btn primary" type="button">＋ 案件登録</button></div><div class="actions utility-actions"><button id="resetDemo" class="btn danger" type="button">デモ初期化</button></div><div id="caseList"></div></section>
<section id="view-detail" class="view hidden"><button id="back" class="btn back" type="button">← 案件一覧</button><div id="detailCard" class="detail-stack"></div></section>
<section id="view-schedule" class="view hidden"><div class="page-head"><div><h1>物件スケジュール</h1><p class="muted">予定をタップすると案件詳細を開きます。</p></div><label><span class="field-label">物件</span><select id="scheduleProperty" class="select"></select></label></div><div id="scheduleSummary" class="summary-grid"></div><div id="scheduleWrap" class="schedule-wrap" tabindex="0"></div><div class="legend"><span><i class="dot survey-dot"></i>現調</span><span><i class="dot work-dot"></i>工事</span></div></section>
<section id="view-responses" class="view hidden"><div class="subtabs"><button class="btn primary" type="button" data-response-mode="list">回答一覧</button><button class="btn" type="button" data-response-mode="form">入居者回答フォーム</button></div><div id="responseListPanel"><div id="responseList"></div></div><div id="responseFormPanel" class="hidden"><form id="residentForm" class="card form"><div class="big">現地調査 希望日時のご入力</div><div class="muted">案内文のQRコードから回答する想定です。</div><label><span>物件名</span><input class="input" name="property" value="○○マンション" required></label><div class="two"><label><span>部屋番号</span><input class="input" name="room" value="102号室" required></label><label><span>お名前</span><input class="input" name="name" placeholder="山田 太郎" required></label></div><label><span>電話番号</span><input class="input" name="phone" placeholder="090-1234-5678" required></label><div class="preference-grid"><fieldset><legend>第1希望</legend><div class="two"><input class="input" name="d1" type="date" required><select class="select" name="t1"><option>9:00〜12:00</option><option>13:00〜15:00</option><option>15:00〜17:00</option></select></div></fieldset><fieldset><legend>第2希望</legend><div class="two"><input class="input" name="d2" type="date" required><select class="select" name="t2"><option>9:00〜12:00</option><option>13:00〜15:00</option><option>15:00〜17:00</option></select></div></fieldset></div><label><span>その他連絡事項</span><textarea class="textarea" name="note"></textarea></label><button class="btn primary full" type="submit">希望日時を送信</button></form></div></section>
<section id="view-history" class="view hidden"><div class="page-head"><div><h1>変更履歴</h1><p class="muted">新しい操作から表示します。</p></div></div><div class="history-filters"><select id="historyUser" class="select"></select><select id="historyProperty" class="select"></select></div><div id="historyList"></div></section>
<footer class="foot">※デモ内容と写真はこの端末内に保存されます。写真は縮小保存されます。</footer></main>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalbox"><div class="modalhead"><div id="modalTitle" class="big">案件登録</div><button id="closeModal" class="btn" type="button">閉じる</button></div><form id="caseForm" class="form"><input type="hidden" name="id"><div class="two"><label><span>物件名</span><input class="input" name="property" required></label><label><span>部屋番号</span><input class="input" name="room" required></label></div><label><span>住所</span><input class="input" name="address"></label><div class="two"><label><span>管理会社 / オーナー</span><input class="input" name="owner"></label><label><span>ステータス</span><select class="select" name="status" id="statusSelect"></select></label></div><div class="two"><label><span>現調担当</span><select class="select" name="surveyStaff" id="surveyStaffSelect"></select></label><label><span>現調予定日時</span><input class="input" type="datetime-local" name="surveyAt"></label></div><div class="two"><label><span>見積金額（円）</span><input class="input" type="number" min="0" step="1000" name="estimateAmount"></label><label><span>材料納品予定日</span><input class="input" type="date" name="materialDeliveryAt"></label></div><div class="two"><label><span>工事担当</span><select class="select" name="workStaff" id="workStaffSelect"></select></label><label><span>施工予定日時</span><input class="input" type="datetime-local" name="workAt"></label></div><label><span>備考</span><textarea class="textarea" name="note"></textarea></label><button class="btn primary full" type="submit">保存</button></form></div></div>
<script type="module" src="assets/js/app.js?v=20260901-7"></script></body></html>
