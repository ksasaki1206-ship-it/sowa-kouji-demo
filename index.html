<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><title>総和 工事進捗管理</title><link rel="stylesheet" href="assets/css/styles.css"></head><body><main class="app"><div class="top"><div><div class="brand">総和 工事進捗管理</div><div class="muted">お客様操作用デモ</div></div><div class="tabs"><button class="tab active" data-view="home">今日</button><button class="tab" data-view="cases">案件</button><button class="tab" data-view="resident">入居者</button><button class="tab" data-view="responses">回答一覧</button></div></div><div id="notice" class="notice"></div><section id="view-home"><div class="stats"><div class="card stat"><div class="k">進行中</div><div id="stOpen" class="v">0</div></div><div class="card stat"><div class="k">本日現調</div><div id="stSurvey" class="v">0</div></div><div class="card stat"><div class="k">本日工事</div><div id="stWork" class="v">0</div></div><div class="card stat"><div class="k">回答待ち</div><div id="stWait" class="v">0</div></div></div><div id="todayBlocks"></div></section><section id="view-cases" class="hidden"><div class="search"><input id="search" class="input" placeholder="物件・部屋・担当で検索"><select id="filter" class="select"></select><button id="newCase" class="btn primary" type="button">＋案件登録</button></div><div class="actions" style="margin-top:8px"><button id="resetDemo" class="btn danger" type="button">デモ初期化</button></div><div id="caseList"></div></section><section id="view-detail" class="hidden"><button id="back" class="btn" type="button" style="margin-top:12px">← 案件一覧</button><div id="detailCard" class="card detail"></div></section><section id="view-resident" class="hidden"><form id="residentForm" class="card form"><div class="big">現地調査 希望日時のご入力</div><div class="muted">案内文のQRコードから回答する想定です。</div><label><span>物件名</span><input class="input" name="property" value="○○マンション" required></label><div class="two"><label><span>部屋番号</span><input class="input" name="room" value="102号室" required></label><label><span>お名前</span><input class="input" name="name" placeholder="山田 太郎" required></label></div><label><span>電話番号</span><input class="input" name="phone" placeholder="090-1234-5678" required></label><div class="two"><label><span>第1希望</span><input class="input" name="d1" type="date" value="2026-09-03" required></label><label><span>時間帯</span><select class="select" name="t1"><option>9:00〜12:00</option><option>13:00〜15:00</option><option>15:00〜17:00</option></select></label></div><label><span>その他連絡事項</span><textarea class="textarea" name="note"></textarea></label><button class="btn primary" style="width:100%;margin-top:14px" type="submit">希望日時を送信</button></form></section><section id="view-responses" class="hidden"><div id="responseList"></div></section><div class="foot">※デモ内容と写真はこの端末内に保存されます。写真は縮小保存されます。</div></main><div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><div id="modalTitle" class="big">案件登録</div><button id="closeModal" class="btn" type="button">閉じる</button></div><form id="caseForm" class="form"><input type="hidden" name="id"><div class="two"><label><span>物件名</span><input class="input" name="property" required></label><label><span>部屋番号</span><input class="input" name="room" required></label></div><label><span>住所</span><input class="input" name="address"></label><div class="two"><label><span>管理会社</span><input class="input" name="owner"></label><label><span>ステータス</span><select class="select" name="status" id="statusSelect"></select></label></div><div class="two"><label><span>現調担当</span><select class="select" name="surveyStaff"><option>未定</option><option>佐藤</option><option>鈴木</option><option>田中</option></select></label><label><span>現調日時</span><input class="input" type="datetime-local" name="surveyAt"></label></div><div class="two"><label><span>工事担当</span><select class="select" name="workStaff"><option>未定</option><option>山田班</option><option>高橋班</option><option>佐々木班</option></select></label><label><span>工事日時</span><input class="input" type="datetime-local" name="workAt"></label></div><label><span>備考</span><textarea class="textarea" name="note"></textarea></label><button class="btn primary" style="width:100%;margin-top:12px" type="submit">保存</button></form></div></div><script src="assets/js/app.js" defer></script></body></html>
